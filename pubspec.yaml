name: moji_sheet
description: >-
  A small spreadsheet for Flutter - several sheets, formulas across sheets,
  locale-aware numbers and dates, cell colours, charts, CSV and JSON. Mobile and web.
version: 0.1.0
homepage: https://mojiapp.eu
repository: https://github.com/spich/moji_sheet
issue_tracker: https://github.com/spich/moji_sheet/issues

topics:
  - spreadsheet
  - table
  - formulas
  - csv
  - charts

environment:
  sdk: ^3.10.7
  flutter: ">=3.38.0"

dependencies:
  fl_chart: ^1.3.1
  flutter:
    sdk: flutter
  worksheet: ^3.9.2
  worksheet_formula: ^1.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
